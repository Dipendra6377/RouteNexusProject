server:
  port: 8080

spring:
  application:
    name: traffic-router

  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/traffic_router
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: host.docker.internal
      port: 6379

routing:
  retry-count: 2

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true