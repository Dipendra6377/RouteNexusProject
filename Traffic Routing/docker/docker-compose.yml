services:
  postgres:
    image: postgres:17

    container_name: traffic-router-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: traffic_router
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8

    container_name: traffic-router-redis

    ports:
      - "6379:6379"

    restart: unless-stopped

volumes:
  postgres_data:

